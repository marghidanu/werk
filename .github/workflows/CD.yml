name: CD

on:
  release:
    types:
      - published

env:
  APP_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Install Crystal
        uses: oprypin/install-crystal@v1
        with:
          crystal: 1.19.1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update shard version
        run: yq eval -i ".version = \"${APP_VERSION}\"" shard.yml

      - name: Install dependencies
        run: shards install --production --ignore-crystal-version

      - name: Build
        run: shards build --release --no-debug

      - name: Upload application
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./bin/werk
          asset_name: werk-darwin-arm64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Homebrew formula update
        uses: mislav/bump-homebrew-formula-action@v1.12
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
        with:
          formula-name: werk
          homebrew-tap: marghidanu/homebrew-werk
          base-branch: master

  build-linux:
    runs-on: "${{ matrix.os }}"
    container:
      image: 84codes/crystal:1.19.1-alpine
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            asset: werk-linux-amd64
          - os: ubuntu-24.04-arm
            asset: werk-linux-arm64

    steps:
      - name: Install build dependencies
        run: apk add --no-cache yaml-static zlib-static

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update shard version
        run: sed -i "s/^version: .*/version: ${APP_VERSION}/" shard.yml

      - name: Install dependencies
        run: shards install --production --ignore-crystal-version

      - name: Build static
        run: shards build --release --no-debug --static

      - name: Upload application
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./bin/werk
          asset_name: ${{ matrix.asset }}
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update shard version
        run: yq eval -i ".version = \"${APP_VERSION}\"" shard.yml

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          tags: ghcr.io/${{ github.repository }}:${{ env.APP_VERSION }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
